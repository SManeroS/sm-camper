<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#254d43"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>SM Camper 0.1</title></head><body><header><div class="brand">SM CAMPER <small>0.1</small></div><p>El camino es parte del viaje</p></header><main><nav><button data-tab="trips">Mis viajes</button><button data-tab="vehicle">Mi camper</button><button data-tab="settings">Ajustes</button></nav><section id="trips"><h1>Mis viajes</h1><button id="newTrip">+ Nuevo viaje</button><div id="tripList"></div><div id="editor" hidden><h2>Ficha del viaje</h2><form id="tripForm"><label>Nombre<input name="name" required></label><label>Salida<input name="origin"></label><label>Destino<input name="destination"></label><div class="pair"><label>Desde<input name="start" type="date"></label><label>Hasta<input name="end" type="date"></label></div><label>Estado<select name="status"><option>Previsto</option><option>En curso</option><option>Realizado</option></select></label><label>Preferencia de paseos<select name="walk"><option>Fáciles y moderados</option><option>Solo fáciles</option><option>Todos</option></select></label><label>Notas<textarea name="notes"></textarea></label><h3>Etapas</h3><div id="stages"></div><button type="button" id="addStage">+ Añadir etapa</button><div class="actions"><button>Guardar viaje</button><button type="button" id="cancel">Cancelar</button></div></form></div></section><section id="vehicle" hidden><h1>Mi camper</h1><form id="vehicleForm"><label>Vehículo<input name="model"></label><label>Año<input name="year" type="number"></label><label>Altura (m)<input name="height" type="number" step="0.01" min="0"></label><label>Longitud (m)<input name="length" type="number" step="0.01" min="0"></label><label>Anchura (m)<input name="width" type="number" step="0.01" min="0"></label><label>Notas<textarea name="notes"></textarea></label><button>Guardar ficha</button></form></section><section id="settings" hidden><h1>Ajustes</h1><form id="settingsForm"><label>Salida habitual<input name="origin"></label><label>Preferencia de paseos<select name="walk"><option>Fáciles y moderados</option><option>Solo fáciles</option><option>Todos</option></select></label><button>Guardar preferencias</button></form><h2>Copias de seguridad</h2><p>Los datos se guardan en este navegador. No hay sincronización automática.</p><button id="export">Exportar datos</button><label>Importar copia (sustituye los datos actuales)<input id="import" type="file" accept=".json,application/json"></label></section><p id="message" role="status"></p></main><script src="app.js"></script></body></html>
